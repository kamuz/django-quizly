{% extends "base.html" %}
{% block title %}Create an account{% endblock %}
{% block content %}
<div class="mx-auto max-w-md">
    <div class="rounded-2xl border border-zinc-200 bg-white p-6 shadow-sm sm:p-8">
        <div class="mb-6">
            <p class="text-sm font-medium text-zinc-500">Get started</p>
            <h1 class="mt-2 text-2xl font-semibold tracking-tight">Create your account</h1>
            <p class="mt-2 text-sm text-zinc-500">Save your progress and see how you improve.</p>
        </div>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="mt-6 w-full rounded-lg bg-zinc-900 px-4 py-3 text-sm font-medium text-white hover:bg-zinc-700">
                Create account
            </button>
        </form>
        <p class="mt-6 text-center text-sm text-zinc-500">
            Already have an account? <a class="font-medium text-zinc-900 hover:underline" href="{% url 'login' %}">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
