{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="mx-auto max-w-md">
    <div class="rounded-2xl border border-zinc-200 bg-white p-6 shadow-sm sm:p-8">
        <div class="mb-6">
            <p class="text-sm font-medium text-zinc-500">Welcome back</p>
            <h1 class="mt-2 text-2xl font-semibold tracking-tight">Log in to your account</h1>
            <p class="mt-2 text-sm text-zinc-500">Continue learning right where you left off.</p>
        </div>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="mt-6 w-full rounded-lg bg-zinc-900 px-4 py-3 text-sm font-medium text-white hover:bg-zinc-700">
                Log in
            </button>
        </form>
        <p class="mt-6 text-center text-sm text-zinc-500">
            New here? <a class="font-medium text-zinc-900 hover:underline" href="{% url 'register' %}">Create an account</a>
        </p>
    </div>
</div>
{% endblock %}
