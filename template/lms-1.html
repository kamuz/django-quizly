<title>Кодовня</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
/* Layout: sticky top bar, lesson tree on the left (drawer on phones), player + tabs on the right */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --sunken:#E8EDEA; --line:#D5DDD8;
  --fg:#14201C; --muted:#5A6B64;
  --accent:#0F766E; --accent-fg:#FFFFFF; --accent-soft:#D6EEEA;
  --ok:#15803D; --warn:#B45309;
  --font-display:'Unbounded','Onest',system-ui,sans-serif;
  --font-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#151F1C; --sunken:#1B2723; --line:#2A3833;
  --fg:#E6EEEA; --muted:#93A59D;
  --accent:#2DD4BF; --accent-fg:#06201C; --accent-soft:#12302B;
  --ok:#4ADE80; --warn:#FBBF24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#151F1C; --sunken:#1B2723; --line:#2A3833;
  --fg:#E6EEEA; --muted:#93A59D;
  --accent:#2DD4BF; --accent-fg:#06201C; --accent-soft:#12302B;
  --ok:#4ADE80; --warn:#FBBF24; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.stage{background:#0B1312;color:#E6EEEA}
.seek{height:6px;background:rgba(255,255,255,.22);border-radius:99px;position:relative;cursor:pointer}
.seek-fill{position:absolute;inset:0 auto 0 0;background:#2DD4BF;border-radius:99px}
.seek-tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:#0B1312}
.seek-knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:99px;background:#fff}
.ctl{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;color:#E6EEEA}
.ctl:hover{background:rgba(255,255,255,.14)}
.tabbtn[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.lesson-row[aria-current="true"]{background:var(--accent-soft)}
.scroll-x{overflow-x:auto}
.ts{font-family:var(--font-mono);font-size:12px;background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script>
tailwind.config={theme:{extend:{colors:{
  bg:'var(--bg)',surface:'var(--surface)',sunken:'var(--sunken)',line:'var(--line)',
  ink:'var(--fg)',muted:'var(--muted)',accent:'var(--accent)','accent-fg':'var(--accent-fg)',
  soft:'var(--accent-soft)',ok:'var(--ok)',warn:'var(--warn)'},
  fontFamily:{display:['Unbounded','Onest','system-ui','sans-serif'],sans:['Onest','system-ui','sans-serif'],mono:['JetBrains Mono','ui-monospace','monospace']}}}};
</script>

<header class="sticky z-30 border-b border-line bg-surface" style="top:env(safe-area-inset-top,0px)">
  <div class="mx-auto flex h-14 max-w-[1400px] items-center gap-3 px-4 sm:px-6">
    <button id="menuBtn" class="lg:hidden inline-flex h-10 w-10 items-center justify-center rounded-lg border border-line" aria-label="Відкрити список уроків" aria-controls="side" aria-expanded="false" hidden><i data-lucide="menu"></i></button>
    <button id="brand" class="flex shrink-0 items-center gap-2.5 rounded-lg py-1 pr-1" aria-label="Кодовня, до каталогу курсів">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" style="fill:var(--accent)"/><rect x="7" y="17" width="5" height="8" rx="1.6" style="fill:var(--accent-fg);opacity:.55"/><rect x="13.5" y="12.5" width="5" height="12.5" rx="1.6" style="fill:var(--accent-fg);opacity:.8"/><rect x="20" y="8" width="5" height="17" rx="1.6" style="fill:var(--accent-fg)"/></svg>
      <span class="font-display text-sm font-semibold tracking-tight">Кодовня</span>
    </button>
    <div class="min-w-0 flex-1">
      <div id="hdrCrumb" class="hidden min-w-0 items-center gap-2 text-sm text-muted md:flex" hidden><i data-lucide="chevron-right" class="h-4 w-4 shrink-0"></i><span class="truncate">Laravel з нуля</span></div>
          </div>
    <div id="topProg" class="flex min-w-0 items-center gap-2" title="Прогрес курсу" hidden>
      <div class="hidden h-2 w-28 overflow-hidden rounded-full bg-sunken sm:block"><div id="topBar" class="h-full rounded-full bg-accent" style="width:0%"></div></div>
      <span id="topCount" class="whitespace-nowrap font-mono text-xs text-muted">0/8</span>
    </div>
    <button id="themeBtn" class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-line" aria-label="Змінити тему"><i data-lucide="sun-moon"></i></button>
  </div>
</header>

<div id="scrim" class="fixed inset-0 z-40 hidden bg-black/50 lg:hidden" hidden></div>

<section id="homeView" class="mx-auto max-w-[1400px] px-4 py-8 sm:px-6 sm:py-10" hidden>
  <div class="max-w-2xl">
    <p class="font-mono text-xs uppercase tracking-wider text-muted">Каталог курсів</p>
    <h1 class="mt-2 font-display text-2xl font-semibold leading-tight tracking-tight sm:text-4xl">Вчіться програмувати крок за кроком</h1>
    <p class="mt-3 max-w-[60ch] text-muted">Відеоуроки з практикою, матеріалами до кожного заняття та обговоренням під відео. Проходьте у власному темпі: прогрес зберігається.</p>
  </div>
  <div id="stats" class="mt-6 grid max-w-2xl grid-cols-3 divide-x divide-line rounded-xl border border-line bg-surface"></div>
  <div id="resume" class="mt-4"></div>
  <div class="mt-8 flex flex-wrap items-center gap-3">
    <div class="min-w-0 flex-1" style="min-width:min(100%,16rem);max-width:24rem">
      <label for="q" class="sr-only">Пошук курсів</label>
      <div class="relative"><span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-muted"><i data-lucide="search" class="h-4 w-4"></i></span><input id="q" type="search" placeholder="Знайти курс" class="h-10 w-full rounded-lg border border-line bg-surface pl-9 pr-3 text-sm placeholder:text-muted focus:border-accent"></div>
    </div>
    <div id="chips" class="flex flex-wrap gap-2" role="group" aria-label="Фільтр курсів"></div>
  </div>
  <ul id="grid" class="mt-5 grid gap-4 sm:grid-cols-2 xl:grid-cols-3"></ul>
</section>

<div id="courseView" class="mx-auto flex max-w-[1400px]" hidden>
  <aside id="side" class="fixed inset-y-0 left-0 z-50 w-[88%] max-w-sm -translate-x-full overflow-y-auto border-r border-line bg-surface transition-transform lg:sticky lg:z-10 lg:w-80 lg:max-w-none lg:shrink-0 lg:translate-x-0" style="padding-top:env(safe-area-inset-top,0px);top:0" aria-label="Уроки курсу">
    <div class="flex items-center justify-between px-4 py-3 lg:hidden">
      <span class="font-display text-sm font-semibold">Зміст курсу</span>
      <button id="closeBtn" class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-line" aria-label="Закрити"><i data-lucide="x"></i></button>
    </div>
    <nav id="tree" class="px-3 pb-6 pt-1 lg:pt-4"></nav>
  </aside>

  <main class="min-w-0 flex-1 px-4 py-5 sm:px-6 lg:py-6">
    <div class="mb-3 flex flex-wrap items-center gap-x-4 gap-y-1">
      <button id="allCourses" class="inline-flex items-center gap-1.5 text-sm font-medium text-accent hover:underline"><i data-lucide="arrow-left" class="h-4 w-4"></i>Усі курси</button>
      <p id="crumb" class="font-mono text-xs uppercase tracking-wider text-muted"></p>
    </div>

    <section class="stage overflow-hidden rounded-xl" id="stage" aria-label="Відеоплеєр">
      <div class="relative w-full" style="aspect-ratio:16/9;max-width:100%">
        <canvas id="cv" class="absolute inset-0 h-full w-full"></canvas>
        <video id="vid" class="absolute inset-0 h-full w-full bg-black" playsinline hidden></video>
        <button id="bigPlay" class="absolute inset-0 flex items-center justify-center" aria-label="Відтворити">
          <span class="inline-flex h-16 w-16 items-center justify-center rounded-full bg-white text-black shadow-lg"><i data-lucide="play" class="h-7 w-7"></i></span>
        </button>
      </div>
      <div class="px-3 pb-2 pt-3 sm:px-4">
        <div id="seek" class="seek" role="slider" tabindex="0" aria-label="Перемотування" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="seekFill" class="seek-fill" style="width:0%"></div>
          <div id="seekTicks"></div>
          <div id="seekKnob" class="seek-knob" style="left:0%"></div>
        </div>
        <div class="mt-2 flex flex-wrap items-center gap-x-1 gap-y-1">
          <button id="pp" class="ctl" aria-label="Відтворити / пауза"><i data-lucide="play"></i></button>
          <button id="back" class="ctl" aria-label="Назад на 10 секунд"><i data-lucide="rotate-ccw"></i></button>
          <button id="fwd" class="ctl" aria-label="Вперед на 10 секунд"><i data-lucide="rotate-cw"></i></button>
          <span id="time" class="px-2 font-mono text-xs tabular-nums">0:00 / 0:00</span>
          <span id="chap" class="hidden min-w-0 flex-1 truncate px-2 text-xs text-[#93A59D] md:block"></span>
          <span class="flex-1 md:hidden"></span>
          <button id="speed" class="ctl w-auto px-2 font-mono text-xs" aria-label="Швидкість відтворення">1×</button>
          <button id="fs" class="ctl" aria-label="На весь екран"><i data-lucide="maximize"></i></button>
        </div>
      </div>
    </section>

    <div class="mt-5 flex flex-wrap items-start justify-between gap-4">
      <div class="min-w-0 flex-1" style="min-width:min(100%,18rem)">
        <h1 id="title" class="font-display text-xl font-semibold leading-tight tracking-tight sm:text-2xl"></h1>
        <p id="metaLine" class="mt-1 text-sm text-muted"></p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button id="prev" class="inline-flex h-10 items-center gap-1.5 rounded-lg border border-line bg-surface px-3 text-sm font-medium disabled:opacity-40"><i data-lucide="chevron-left" class="h-4 w-4"></i>Попередній</button>
        <button id="done" class="inline-flex h-10 items-center gap-1.5 rounded-lg border border-line bg-surface px-3 text-sm font-medium"></button>
        <button id="next" class="inline-flex h-10 items-center gap-1.5 rounded-lg bg-accent px-3 text-sm font-semibold text-accent-fg disabled:opacity-40">Наступний<i data-lucide="chevron-right" class="h-4 w-4"></i></button>
      </div>
    </div>

    <div class="mt-6 border-b border-line">
      <div class="scroll-x flex gap-5" role="tablist" id="tabs">
        <button role="tab" data-tab="about" class="tabbtn -mb-px border-b-2 border-transparent py-2.5 text-sm font-medium text-muted">Про урок</button>
        <button role="tab" data-tab="files" class="tabbtn -mb-px border-b-2 border-transparent py-2.5 text-sm font-medium text-muted">Матеріали</button>
        <button role="tab" data-tab="talk" class="tabbtn -mb-px whitespace-nowrap border-b-2 border-transparent py-2.5 text-sm font-medium text-muted">Коментарі <span id="cCount" class="ml-1 rounded-full bg-sunken px-1.5 py-0.5 font-mono text-[11px]">0</span></button>
      </div>
    </div>
    <div id="panel" class="py-5" role="tabpanel"></div>
  </main>
</div>

<div id="toast" class="pointer-events-none fixed left-1/2 z-[60] -translate-x-1/2 rounded-lg bg-[#14201C] px-4 py-2 text-sm text-white opacity-0 transition-opacity" style="bottom:calc(1.25rem + env(safe-area-inset-bottom,0px))" role="status" aria-live="polite"></div>

var cv=$('#cv'),ctx=cv.getContext('2d'),vid=$('#vid');
var P={t:0,playing:false,rate:1,last:0,useVideo:false};
var RATES=[1,1.25,1.5,2,0.75];
var KW=/^(Route|use|function|return|class|public|new|php|artisan|composer|Schema|extends|protected|Lesson|Course|cd)$/;
function dur(){return P.useVideo&&vid.duration?vid.duration:cur.dur}

function play(on){
  P.playing=on;P.last=performance.now();
  if(P.useVideo){on?vid.play().catch(function(){}):vid.pause()}
  $('#bigPlay').hidden=on;
  $('#pp').innerHTML=ico(on?'pause':'play');refresh();
}
function chapterIdx(){var n=cur.slides.length;return Math.min(n-1,Math.floor(P.t/dur()*n))}
function uiTime(){
  var p=dur()?P.t/dur()*100:0;
  $('#seekFill').style.width=p+'%';$('#seekKnob').style.left=p+'%';
  $('#seek').setAttribute('aria-valuenow',Math.round(p));
  $('#time').textContent=fmt(P.t)+' / '+fmt(dur());
  $('#chap').textContent='Розділ '+(chapterIdx()+1)+'. '+cur.slides[chapterIdx()].t;
}
function fit(){
  var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
  cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));draw();
}
function paint(line,x,y){
  var re=/(\/\/.*$|<!--.*-->)|('[^']*'|"[^"]*")|(\$\w+)|(@\w+)|([A-Za-z_]+)/g,last=0,m;
  function seg(txt,col){ctx.fillStyle=col;ctx.fillText(txt,x,y);x+=ctx.measureText(txt).width}
  while((m=re.exec(line))){
    if(m.index>last)seg(line.slice(last,m.index),'#C8D6D0');
    var c=m[1]?'#6F857C':m[2]?'#86EFAC':m[3]?'#FCD34D':m[4]?'#F9A8D4':KW.test(m[5])?'#2DD4BF':'#E6EEEA';
    seg(m[0],c);last=m.index+m[0].length;
  }
  if(last<line.length)seg(line.slice(last),'#C8D6D0');
  return x;
}
function draw(){
  if(P.useVideo)return;
  var W=cv.width,H=cv.height,d=W/Math.max(1,cv.getBoundingClientRect().width||1);
  var s=Math.min(W/720,H/405);
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0B1312';ctx.fillRect(0,0,W,H);
  var n=cur.slides.length,len=dur()/n,i=chapterIdx(),sl=cur.slides[i],local=(P.t-i*len)/len;
  ctx.setTransform(s,0,0,s,(W-720*s)/2,(H-405*s)/2);
  ctx.textBaseline='alphabetic';
  ctx.fillStyle='#2DD4BF';ctx.font='500 12px "JetBrains Mono",monospace';ctx.fillText('РОЗДІЛ '+(i+1)+' / '+n,36,48);
  ctx.fillStyle='#E6EEEA';ctx.font='600 26px Unbounded,Onest,sans-serif';ctx.fillText(sl.t,36,86);
  ctx.fillStyle='#14211E';ctx.beginPath();ctx.roundRect(36,112,648,232,10);ctx.fill();
  ctx.fillStyle='#2A3833';ctx.fillRect(36,112,648,28);
  ['#F87171','#FBBF24','#4ADE80'].forEach(function(c,k){ctx.fillStyle=c;ctx.beginPath();ctx.arc(54+k*16,126,4.5,0,7);ctx.fill()});
  ctx.fillStyle='#93A59D';ctx.font='400 11px "JetBrains Mono",monospace';ctx.fillText('terminal · lms',620-ctx.measureText('terminal · lms').width+60,130);
  var total=sl.c.join('\n').length,typed=Math.floor(Math.min(1,local*1.8)*total),used=0,y=170;
  ctx.font='400 15px "JetBrains Mono",monospace';
  var ex=60,ey=y;
  for(var k=0;k<sl.c.length;k++){
    var ln=sl.c[k],vis=ln.slice(0,Math.max(0,typed-used));used+=ln.length+1;
    ctx.fillStyle='#4B5F57';ctx.fillText(String(k+1),42,y);
    ex=paint(vis,64,y);ey=y;
    if(typed-used+ln.length+1<=0&&k>0&&!vis){}
    if(typed>=used-ln.length-1&&typed<used){break}
    y+=24;
  }
  if(Math.floor(performance.now()/450)%2===0||!P.playing){ctx.fillStyle='#2DD4BF';ctx.fillRect(ex+2,ey-13,8,17)}
  ctx.fillStyle='#6F857C';ctx.font='400 12px Onest,sans-serif';ctx.fillText(cur.title,36,378);
  var t=fmt(P.t),tw=ctx.measureText(t).width;ctx.fillText(t,684-tw,378);
}
function tick(now){
  if(P.playing){
    if(P.useVideo){P.t=vid.currentTime}
    else{P.t+=(now-P.last)/1000*P.rate;P.last=now}
    if(P.t>=dur()){P.t=dur();play(false);finish()}
    uiTime();
    if(Math.floor(P.t)%3===0&&!tick.s){tick.s=1;prog.pos[cur.id]=Math.floor(P.t);saveProg()}else if(Math.floor(P.t)%3!==0)tick.s=0;
  }
  if(!document.getElementById('courseView').hidden)draw();
  requestAnimationFrame(tick);
}
function finish(){
  if(!prog.done[cur.id]){prog.done[cur.id]=true;delete prog.pos[cur.id];saveProg();renderTree();renderHead();toast('Урок пройдено')}
}

$('#speed').onclick=function(){var i=(RATES.indexOf(P.rate)+1)%RATES.length;P.rate=RATES[i];vid.playbackRate=P.rate;$('#speed').textContent=P.rate+'×'};

(function(){
  var bar=$('#seek'),drag=false;
  function at(e){var r=bar.getBoundingClientRect();setT((e.clientX-r.left)/r.width*dur())}
  bar.addEventListener('pointerdown',function(e){drag=true;bar.setPointerCapture(e.pointerId);at(e)});
  bar.addEventListener('pointermove',function(e){if(drag)at(e)});

})();
document.addEventListener('keydown',function(e){
  var tg=e.target,tn=tg.tagName;

});

    +'<p class="mt-1 break-words text-sm">'+bodyHTML(c.body)+'</p>'
    +'<div class="mt-1.5 flex flex-wrap items-center gap-1 text-xs text-muted">'
    +'<button data-like="'+c.id+'" data-pid="'+(pid||'')+'" class="inline-flex h-8 items-center gap-1.5 rounded-md px-2 hover:bg-sunken '+(liked?'text-accent font-semibold':'')+'" aria-pressed="'+!!liked+'">'+ico('thumbs-up','h-3.5 w-3.5')+c.likes+'</button>'
    +(pid?'':'<button data-reply="'+c.id+'" class="inline-flex h-8 items-center gap-1.5 rounded-md px-2 hover:bg-sunken">'+ico('corner-down-right','h-3.5 w-3.5')+'Відповісти</button>')
    +(c.mine?'<button data-del="'+c.id+'" data-pid="'+(pid||'')+'" class="inline-flex h-8 items-center gap-1.5 rounded-md px-2 hover:bg-sunken">'+ico('trash-2','h-3.5 w-3.5')+'Видалити</button>':'')
    +'</div>'
    +(pid?'':'<div id="rf-'+c.id+'"></div>'+(c.replies.length?'<div class="mt-3 flex flex-col gap-4 border-l border-line pl-4">'+c.replies.map(function(r){return item(r,c.id)}).join('')+'</div>':''))
    +'</div></div>';
}
function renderTalk(){
  var list=comments.slice().sort(function(a,b){return sort==='top'?(b.likes-a.likes):(b.t-a.t)});
  var inp='w-full rounded-lg border border-line bg-bg px-3 py-2 text-sm placeholder:text-muted focus:border-accent';
  $('#panel').innerHTML='<div class="grid gap-8 lg:grid-cols-[minmax(0,24rem)_minmax(0,1fr)]">'
   +'<form id="cform" class="h-fit rounded-xl border border-line bg-surface p-4" novalidate>'
   +'<h3 class="text-sm font-semibold">Ваше запитання або відгук</h3>'
   +'<label for="cName" class="mt-3 block text-xs font-medium text-muted">Ім’я</label>'
   +'<input id="cName" class="'+inp+' mt-1" maxlength="40" autocomplete="name" placeholder="Як вас підписати" value="'+esc(store.get('lms-name',''))+'">'
   +'<p id="eName" class="mt-1 hidden text-xs text-warn"></p>'
   +'<label for="cBody" class="mt-3 block text-xs font-medium text-muted">Коментар</label>'
   +'<textarea id="cBody" rows="5" maxlength="600" class="'+inp+' mt-1 resize-y" placeholder="Напишіть, що було незрозуміло. Таймкод у форматі [01:30] стане посиланням."></textarea>'
   +'<p id="eBody" class="mt-1 hidden text-xs text-warn"></p>'
   +'<div class="mt-2 flex items-center justify-between gap-2"><button type="button" id="stamp" class="inline-flex h-8 items-center gap-1.5 rounded-md border border-line px-2.5 text-xs font-medium hover:border-accent">'+ico('clock','h-3.5 w-3.5')+'Додати таймкод</button><span id="cLeft" class="font-mono text-xs text-muted">0/600</span></div>'
   +'<button class="mt-4 inline-flex h-10 w-full items-center justify-center gap-2 rounded-lg bg-accent text-sm font-semibold text-accent-fg">'+ico('send')+'Надіслати</button></form>'
   +'<div class="min-w-0"><div class="mb-4 flex items-center justify-between gap-3"><h3 class="text-sm font-semibold">Обговорення · '+count()+'</h3>'
   +'<div class="inline-flex rounded-lg border border-line p-0.5 text-xs">'
   +['new:Нові','top:Популярні'].map(function(x){var k=x.split(':');return '<button data-sort="'+k[0]+'" class="rounded-md px-2.5 py-1.5 '+(sort===k[0]?'bg-accent font-semibold text-accent-fg':'text-muted')+'">'+k[1]+'</button>'}).join('')
   +'</div></div><div class="flex flex-col gap-6">'+(list.length?list.map(function(c){return item(c)}).join(''):'<p class="rounded-xl border border-dashed border-line p-6 text-center text-sm text-muted">Коментарів ще немає. Поставте перше запитання до уроку.</p>')+'</div></div></div>';
  refresh();
}
function fieldErr(id,msg){var e=$('#'+id);e.textContent=msg||'';e.classList.toggle('hidden',!msg)}
function replyForm(cid){
  var box=$('#rf-'+cid);if(box.innerHTML){box.innerHTML='';return}
  box.innerHTML='<form data-rform="'+cid+'" class="mt-3 flex flex-col gap-2" novalidate><label class="sr-only" for="rb-'+cid+'">Відповідь</label><textarea id="rb-'+cid+'" rows="2" maxlength="600" class="w-full rounded-lg border border-line bg-bg px-3 py-2 text-sm placeholder:text-muted focus:border-accent" placeholder="Ваша відповідь"></textarea><p class="hidden text-xs text-warn" data-rerr></p><div class="flex gap-2"><button class="inline-flex h-8 items-center rounded-md bg-accent px-3 text-xs font-semibold text-accent-fg">Відповісти</button><button type="button" data-rcancel="'+cid+'" class="inline-flex h-8 items-center rounded-md border border-line px-3 text-xs">Скасувати</button></div></form>';
  $('#rb-'+cid).focus();
}
function author(){var n=($('#cName')&&$('#cName').value.trim())||store.get('lms-name','');return n||'Студент'}
var panel=$('#panel');
panel.addEventListener('input',function(e){if(e.target.id==='cBody'){$('#cLeft').textContent=e.target.value.length+'/600';fieldErr('eBody','')}if(e.target.id==='cName')fieldErr('eName','')});
panel.addEventListener('submit',function(e){
  e.preventDefault();var f=e.target;
  if(f.id==='cform'){
    var n=$('#cName').value.trim(),b=$('#cBody').value.trim(),bad=false;
    if(n.length<2){fieldErr('eName','Вкажіть ім’я, щонайменше 2 символи.');bad=true}
    if(b.length<3){fieldErr('eBody','Напишіть щонайменше 3 символи.');bad=true}
    if(bad){(n.length<2?$('#cName'):$('#cBody')).focus();return}
    store.set('lms-name',n);
    comments.unshift({id:Date.now(),name:n,t:Date.now(),body:b,likes:0,replies:[],mine:true});
    saveC();sort='new';renderTalk();toast('Коментар додано');
  }else if(f.dataset.rform){
    var ta=f.querySelector('textarea'),v=ta.value.trim(),er=f.querySelector('[data-rerr]');
    if(v.length<2){er.textContent='Напишіть відповідь.';er.classList.remove('hidden');ta.focus();return}
    var c=comments.filter(function(x){return String(x.id)===f.dataset.rform})[0];
    c.replies.push({id:Date.now(),name:author(),t:Date.now(),body:v,likes:0,mine:true});
    saveC();renderTalk();toast('Відповідь додано');
  }
});
panel.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.id==='stamp'){var ta=$('#cBody'),s='['+fmt(P.t)+'] ';var p=ta.selectionStart||ta.value.length;ta.value=ta.value.slice(0,p)+s+ta.value.slice(p);ta.focus();ta.setSelectionRange(p+s.length,p+s.length);$('#cLeft').textContent=ta.value.length+'/600'}
  else if(t.dataset.sort){sort=t.dataset.sort;renderTalk()}
  else if(t.dataset.reply)replyForm(t.dataset.reply);
  else if(t.dataset.rcancel)$('#rf-'+t.dataset.rcancel).innerHTML='';
  else if(t.dataset.like){
    var lk=store.get('lms-liked',{}),key=(t.dataset.pid||'')+'-'+t.dataset.like+cur.id;
    var arr=t.dataset.pid?comments.filter(function(x){return String(x.id)===t.dataset.pid})[0].replies:comments;
    var c=arr.filter(function(x){return String(x.id)===t.dataset.like})[0];
    if(lk[key]){delete lk[key];c.likes--}else{lk[key]=1;c.likes++}
    store.set('lms-liked',lk);saveC();renderTalk();
  }else if(t.dataset.del){
    if(t.dataset.pid){var pc=comments.filter(function(x){return String(x.id)===t.dataset.pid})[0];pc.replies=pc.replies.filter(function(x){return String(x.id)!==t.dataset.del})}
    else comments=comments.filter(function(x){return String(x.id)!==t.dataset.del});
    saveC();renderTalk();toast('Коментар видалено');
  }
});

/* ---------- Load a lesson ---------- */
function load(id){
  cur=byId(id);prog.cur=id;saveProg();
  play(false);P.useVideo=!!cur.src;
  vid.hidden=!P.useVideo;cv.hidden=P.useVideo;
  if(P.useVideo)vid.src=cur.src;
  setT(prog.done[id]?0:(prog.pos[id]||0));
  $('#seekTicks').innerHTML=cur.slides.map(function(s,i){return i?'<span class="seek-tick" style="left:'+(i/cur.slides.length*100)+'%"></span>':''}).join('');
  loadC();renderTree();renderHead();renderTab();fit();
}
/* ---------- Catalog and views ---------- */
var hm=function(s){var h=Math.floor(s/3600),m=Math.round(s%3600/60);return h?h+' год '+m+' хв':m+' хв'};
var TOTAL=LESSONS.reduce(function(a,l){return a+l.dur},0);
var CATALOG=[
 {id:'laravel',open:true,title:'Laravel з нуля',glyph:'<?php',color:'#FB7185',level:'Початковий',summary:'Маршрути, Blade, Eloquent, міграції, Livewire і форми. Збираємо застосунок із коментарями до уроків.',lessons:LESSONS.length,secs:TOTAL},
 {id:'django',title:'Django для вебу',glyph:'py',color:'#4ADE80',level:'Початковий',summary:'Моделі, шаблони, адмінка та форми. Той самий застосунок, але на Python.',lessons:10,secs:5400},
 {id:'livewire',title:'Livewire 3 на практиці',glyph:'wire:',color:'#C084FC',level:'Середній',summary:'Реактивні компоненти, події, завантаження файлів і тести без зайвого JavaScript.',lessons:9,secs:4800},
 {id:'tailwind',title:'Tailwind CSS: інтерфейси',glyph:'css',color:'#38BDF8',level:'Початковий',summary:'Адаптивна сітка, темна тема, компоненти й дизайн-токени для справжніх сторінок.',lessons:7,secs:3600},
 {id:'git',title:'Git і GitHub щодня',glyph:'git',color:'#FBBF24',level:'Початковий',summary:'Гілки, коміти, pull request і розв’язання конфліктів у командній роботі.',lessons:6,secs:2700}
];
var hq='',hf='all';
function started(){return Object.keys(prog.done).length>0||Object.keys(prog.pos).length>0}
function doneCount(){return Object.keys(prog.done).length}
function renderResume(){
  var box=$('#resume');
  if(!started()){box.innerHTML='';return}
  var pct=Math.round(doneCount()/LESSONS.length*100);
  box.innerHTML='<div class="flex flex-wrap items-center gap-4 rounded-xl border border-line bg-surface p-4"><span class="inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-soft text-accent">'+ico('circle-play','h-6 w-6')+'</span>'
   +'<div class="min-w-0 flex-1" style="min-width:min(100%,14rem)"><p class="font-mono text-xs uppercase tracking-wider text-muted">Продовжити · Laravel з нуля</p><p class="mt-0.5 truncate font-semibold">Урок '+(cur.n+1)+'. '+esc(cur.title)+'</p>'
   +'<div class="mt-2 flex items-center gap-3"><div class="h-1.5 w-full max-w-xs overflow-hidden rounded-full bg-sunken"><div class="h-full rounded-full bg-accent" style="width:'+pct+'%"></div></div><span class="font-mono text-xs text-muted">'+pct+'%</span></div></div>'
   +'<button data-open="laravel" class="inline-flex h-10 items-center gap-2 rounded-lg bg-accent px-4 text-sm font-semibold text-accent-fg">Продовжити'+ico('arrow-right')+'</button></div>';
}
function renderStats(){
  var secs=LESSONS.reduce(function(a,l){return a+(prog.done[l.id]?l.dur:0)},0);
  var items=[[CATALOG.length,'курсів у каталозі'],[doneCount()+'/'+LESSONS.length,'уроків пройдено'],[hm(secs),'навчання']];
  $('#stats').innerHTML=items.map(function(s){return '<div class="min-w-0 px-3 py-3 sm:px-4"><div class="truncate font-mono text-lg font-medium tabular-nums sm:text-xl">'+esc(s[0])+'</div><div class="mt-0.5 text-xs text-muted">'+s[1]+'</div></div>'}).join('');
}
function renderChips(){
  $('#chips').innerHTML=[['all','Усі'],['open','Доступні'],['soon','Незабаром']].map(function(c){
    var on=hf===c[0];
    return '<button data-flt="'+c[0]+'" aria-pressed="'+on+'" class="h-10 rounded-lg border px-3.5 text-sm font-medium '+(on?'border-accent bg-soft text-accent':'border-line bg-surface text-muted hover:border-accent')+'">'+c[1]+'</button>';
  }).join('');
}
function renderGrid(){
  var list=CATALOG.filter(function(c){
    var okF=hf==='all'||(hf==='open'?c.open:!c.open);
    return okF&&(c.title+' '+c.summary+' '+c.glyph).toLowerCase().indexOf(hq)>-1;
  });
  $('#grid').innerHTML=list.length?list.map(function(c){
    var n=c.open?doneCount():0,pct=c.open?Math.round(n/c.lessons*100):0;
    var label=!c.open?'Незабаром':(n===0&&!started()?'Почати курс':n>=c.lessons?'Переглянути ще раз':'Продовжити');
    return '<li><article class="flex h-full flex-col overflow-hidden rounded-xl border border-line bg-surface">'
     +'<div class="relative flex h-36 items-end justify-between px-4 pb-3" style="background:radial-gradient(120% 130% at 92% 0%,'+c.color+'44,transparent 58%),#0B1312">'
     +'<span class="absolute left-3 top-3 rounded-md px-2 py-0.5 font-mono text-[11px]" style="background:rgba(255,255,255,.12);color:#E6EEEA">'+esc(c.level)+'</span>'
     +'<span class="font-mono text-4xl font-medium leading-none" style="color:'+c.color+'">'+esc(c.glyph)+'</span>'
     +(c.open?'':'<span class="rounded-md px-2 py-0.5 font-mono text-[11px]" style="background:rgba(255,255,255,.12);color:#E6EEEA">скоро</span>')+'</div>'
     +'<div class="flex flex-1 flex-col gap-3 p-4"><h2 class="font-display text-base font-semibold leading-snug tracking-tight">'+esc(c.title)+'</h2>'
     +'<p class="text-sm text-muted">'+esc(c.summary)+'</p>'
     +'<p class="font-mono text-xs text-muted">'+c.lessons+' уроків · '+hm(c.secs)+'</p>'
     +(n>0?'<div class="flex items-center gap-3"><div class="h-1.5 flex-1 overflow-hidden rounded-full bg-sunken"><div class="h-full rounded-full bg-accent" style="width:'+pct+'%"></div></div><span class="font-mono text-xs text-muted">'+n+'/'+c.lessons+'</span></div>':'')
     +(c.open?'<button data-open="'+c.id+'" class="mt-auto inline-flex h-10 items-center justify-center gap-2 rounded-lg bg-accent text-sm font-semibold text-accent-fg">'+label+ico('arrow-right')+'</button>'
             :'<button disabled class="mt-auto inline-flex h-10 items-center justify-center rounded-lg bg-sunken text-sm font-medium text-muted">'+label+'</button>')
     +'</div></article></li>';
  }).join(''):'<li class="rounded-xl border border-dashed border-line p-8 text-center text-sm text-muted sm:col-span-2 xl:col-span-3">Нічого не знайдено. Спробуйте інший запит.</li>';
  refresh();
}
function show(v){
  var home=v==='home';
  if(home){play(false);if(!prog.done[cur.id]&&P.t>1){prog.pos[cur.id]=Math.floor(P.t);saveProg()}}
  $('#homeView').hidden=!home;$('#courseView').hidden=home;
  $('#menuBtn').hidden=home;$('#topProg').hidden=home;$('#hdrCrumb').hidden=home;
  if(home){drawer(false);renderStats();renderChips();renderResume();renderGrid();renderTree();document.title='Кодовня — каталог курсів'}
  else{renderHead();fit()}
  refresh();window.scrollTo(0,0);
}
$('#brand').onclick=$('#allCourses').onclick=function(){show('home')};
$('#homeView').addEventListener('click',function(e){
  var o=e.target.closest('[data-open]');if(o){show('course');return}
  var f=e.target.closest('[data-flt]');if(f){hf=f.dataset.flt;renderChips();renderGrid();refresh()}
});
$('#q').addEventListener('input',function(e){hq=e.target.value.trim().toLowerCase();renderGrid()});

load(cur.id);
show('home');
requestAnimationFrame(tick);
})();
</script>
